# Signup form: navigate to signup, fill name + email + password, tap Create.
# Stops BEFORE code verification — that step needs the real email (6-digit
# code from Supabase Auth) and is verified manually.

appId: host.exp.Exponent
tags:
  - parent
  - auth
---
- launchApp
# Skip if already signed in
- runFlow:
    when:
      visible: ".*thriving today.*"
    commands:
      - stopApp
- runFlow:
    when:
      visible: "Sign Up"
    commands:
      - tapOn: "Sign Up"
- assertVisible: "Create"
- tapOn: "e.g. Priya Sharma"
- inputText: "Test Parent"
- tapOn: "you@example.com"
- inputText: "maestro.test@example.com"
- tapOn: "Choose a password"
- inputText: "Maestro-Test1"
- tapOn: "Create account"
# Code screen should appear
- assertVisible:
    text: "Check your email"
    timeout: 10000
- assertVisible: ".*maestro.test@example.com.*"
